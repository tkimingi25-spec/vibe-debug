[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-debug"
version = "0.1.0"
description = "Universal AI pipeline observability for vibe coders - offline-first, zero API keys"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "observability",
    "opentelemetry",
    "mcp",
    "debugging",
    "ai",
    "pipeline",
]
dependencies = [
    "arize-phoenix==13.18.0",
    # Phoenix 13.x imports phoenix.evals.models, removed in evals 3.x;
    # Phoenix metadata leaves evals unbounded above, so cap it here.
    "arize-phoenix-evals~=2.12",
    # graphql-core 3.3 removed ExecutionContext, which the
    # strawberry-graphql version pinned by Phoenix 13.x imports.
    "graphql-core~=3.2.0",
    "opentelemetry-sdk~=1.45",
    "opentelemetry-exporter-otlp-proto-http~=1.45",
    "mcp[cli]~=1.29",
    "httpx~=0.28",
    "wrapt~=1.17",
    "python-dotenv~=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.3",
]

[project.scripts]
vibe-debug = "vibe_debug.cli:main"

[project.urls]
Repository = "https://github.com/tkimingi25-spec/vibe-debug"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibe_debug*", "server*"]
